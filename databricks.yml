bundle:
  name: global_economy_lakehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405609494507557.17.azuredatabricks.net
  prod:
    mode: production
    workspace:
      host: https://adb-7405609494507557.17.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod

resources:
  jobs:
    worldbank_job:
      name: global_economy_lakehouse_bundle_${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - { name: catalog, default: dbt_global_economy }
        - { name: bronze_root, default: "abfss://bronze@stglobaleconomic.dfs.core.windows.net/worldbank/" }
        - { name: silver_schema, default: silver }
        - { name: gold_schema, default: gold }
        - { name: gold_location, default: "abfss://gold@stglobaleconomic.dfs.core.windows.net/worldbank" }
      tasks:
        - task_key: silver
          max_retries: 2
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          max_retries: 2
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
